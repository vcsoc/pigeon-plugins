name: verify
on: [push, pull_request]
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 sdk/sync_sdk.py --check
      - run: python3 scripts/sync_runtime.py --check
      - run: python3 scripts/build_index.py --check
  standalone:
    # Separate job per plugin: some models are large and have independent setup caches.
    strategy:
      fail-fast: false
      matrix:
        plugin: [ai-enlarge, ai-background-removal, ai-object-removal, ai-image-expand, ai-image-expand-diffusion, semantic-search]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow jsonschema
      - run: cargo build --locked --manifest-path sdk/rust/Cargo.toml --bin pigeon-mock
      - run: python3 scripts/test_standalone.py --pigeon-mock sdk/rust/target/debug/pigeon-mock ${{ matrix.plugin }}
