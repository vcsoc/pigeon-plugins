[package]
name = "reelio-app"
description = "Reelio Pigeon plugin binary: protocol v2 transport, scene pump and the engine bridge."
version = "2.0.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "reelio"
path = "src/main.rs"

[dependencies]
reelio-ui = { path = "../ui" }
reelio-engine = { path = "../engine" }
reelio-artwork.workspace = true
reelio-resources.workspace = true
pigeon-plugin-sdk = { path = "../../vendor/pigeon-plugin-sdk" }
serde.workspace = true
serde_json.workspace = true
