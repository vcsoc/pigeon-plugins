[package]
name = "pigeon-immich"
version = "1.0.0"
edition = "2021"
description = "Immich plugin for Pigeon: a library.source, a preferences page and verified transfers, running in its own process"
license = "Apache-2.0"
publish = false

# This crate is built on its own (the plugin is a separate program). Keep it out of any parent workspace.
[workspace]

[[bin]]
name = "pigeon-immich"
path = "src/main.rs"

[lib]
name = "pigeon_immich"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Vendored copy of the WP2 SDK (plugins/immich/vendor, refreshed by sdk/sync_sdk.py; amendment 12).
pigeon-plugin-sdk = { path = "vendor/pigeon-plugin-sdk" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }

[profile.release]
opt-level = 2
debug = false
